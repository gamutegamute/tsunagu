services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shelteros
      POSTGRES_USER: shelteros
      POSTGRES_PASSWORD: shelteros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelteros -d shelteros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://shelteros:shelteros@db:5432/shelteros
      DEMO_SEED: "true"
      APP_ENV: development
      AUTH_MODE: dev
      SESSION_SECRET: local-development-session-secret
      GATEWAY_API_KEY: local-gateway-key
      DEMO_RESET_ENABLED: "true"
      DEMO_ADMIN_EMAILS: local-hq@tsunagu.local
      # 開発用: 署名なしのv1 Packetも受け付ける(コード上のデフォルトはfalse)。
      ALLOW_V1_PACKETS: "true"
      # v2の端末鍵はGit管理外。リポジトリ直下の .env(.env.example を参照)から渡す。
      PACKET_DEVICE_KEYS: ${PACKET_DEVICE_KEYS:-}
      PACKET_DISABLED_DEVICES: ${PACKET_DISABLED_DEVICES:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
