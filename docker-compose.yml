services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shelteros
      POSTGRES_USER: shelteros
      POSTGRES_PASSWORD: shelteros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelteros -d shelteros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://shelteros:shelteros@db:5432/shelteros
      DEMO_SEED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
