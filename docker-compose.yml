services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shelteros
      POSTGRES_USER: shelteros
      POSTGRES_PASSWORD: shelteros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelteros -d shelteros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://shelteros:shelteros@db:5432/shelteros
      DEMO_SEED: "true"
      APP_ENV: development
      AUTH_MODE: dev
      SESSION_SECRET: local-development-session-secret
      GATEWAY_API_KEY: local-gateway-key
      DEMO_RESET_ENABLED: "true"
      DEMO_ADMIN_EMAILS: local-hq@tsunagu.local
      # 開発用の既定は true(署名なしのv1 Packetも受け付ける)。コード上のデフォルトは false。
      # デモ・本番では .env で ALLOW_V1_PACKETS=false にする(docs/emergency-packet-v2.md の移行手順)。
      ALLOW_V1_PACKETS: ${ALLOW_V1_PACKETS:-true}
      # v2の端末鍵はGit管理外。リポジトリ直下の .env(.env.example を参照)から渡す。
      PACKET_DEVICE_KEYS: ${PACKET_DEVICE_KEYS:-}
      PACKET_DISABLED_DEVICES: ${PACKET_DISABLED_DEVICES:-}
      # クラウドへの配送(Outbox)の登録と状態API用。宛先の鍵はAPIには渡さない(ワーカーだけが使う)。
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
      OUTBOX_DESTINATIONS: ${OUTBOX_DESTINATIONS:-}
      OUTBOX_STATUS_DOWN_SECONDS: ${OUTBOX_STATUS_DOWN_SECONDS:-120}
      OUTBOX_STATUS_DELAYED_LATENCY_MS: ${OUTBOX_STATUS_DELAYED_LATENCY_MS:-5000}
      OUTBOX_STATUS_DELAYED_PENDING_SECONDS: ${OUTBOX_STATUS_DELAYED_PENDING_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  # クラウドへの配送ワーカー(docs/outbox.md)。デモ用: docker compose --profile demo up
  outbox-worker:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      DATABASE_URL: postgresql://shelteros:shelteros@db:5432/shelteros
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
      OUTBOX_DESTINATIONS: ${OUTBOX_DESTINATIONS:-}
      # 宛先ごとのGateway Key。OUTBOX_DESTINATIONS の key_env と同じ名前の変数を、ここに足す。
      OUTBOX_KEY_CLOUD_SAT: ${OUTBOX_KEY_CLOUD_SAT:-}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_HTTP_TIMEOUT_SECONDS: ${OUTBOX_HTTP_TIMEOUT_SECONDS:-10}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      OUTBOX_PROBE_INTERVAL_SECONDS: ${OUTBOX_PROBE_INTERVAL_SECONDS:-30}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      db:
        condition: service_healthy
      # テーブルは api の起動時の移行で作られる。
      api:
        condition: service_started

volumes:
  postgres_data:
