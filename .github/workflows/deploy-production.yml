name: 本番環境へ手動デプロイ

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      first_deploy:
        description: "初回構築の場合のみ有効にする"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tsunagu-production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    if: >-
      github.repository == 'gamutegamute/2026-Team-11' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2
      - name: Check whether production files changed
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${DEPLOY_SHA}^1" "$DEPLOY_SHA" | grep -Eq '^(\.dockerignore$|\.github/workflows/deploy-production\.yml$|backend/|frontend/|infra/terraform/)'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-northeast-1
      TF_VAR_aws_region: ap-northeast-1
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_hq_emails: ${{ secrets.HQ_EMAILS_JSON }}
      TF_VAR_field_emails: ${{ secrets.FIELD_EMAILS_JSON }}
      TF_VAR_demo_reset_enabled: ${{ vars.DEMO_RESET_ENABLED || 'false' }}
      TF_VAR_demo_admin_emails: ${{ vars.DEMO_ADMIN_EMAILS_JSON || '[]' }}
      TF_VAR_public_base_url: ${{ vars.PUBLIC_BASE_URL || '' }}
      TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Initialize Terraform
        working-directory: infra/terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=tsunagu/production.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"
      - name: Create foundation on first deployment
        if: github.event_name == 'workflow_dispatch' && inputs.first_deploy
        working-directory: infra/terraform
        run: terraform apply -auto-approve -var="create_service=false"
      - name: Read ECR repository
        id: ecr
        working-directory: infra/terraform
        run: echo "repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
      - name: Check whether immutable image already exists
        id: image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          repository_name="${REPOSITORY#*/}"
          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids "imageTag=${DEPLOY_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.image.outputs.exists != 'true'
      - name: Build and push immutable image
        if: steps.image.outputs.exists != 'true'
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          docker build -f backend/Dockerfile -t "$REPOSITORY:${DEPLOY_SHA}" .
          docker push "$REPOSITORY:${DEPLOY_SHA}"
      - name: Reuse existing immutable image
        if: steps.image.outputs.exists == 'true'
        run: echo "Reusing ${DEPLOY_SHA} from ECR"
      - name: Create setup-mode service on first deployment
        if: github.event_name == 'workflow_dispatch' && inputs.first_deploy
        working-directory: infra/terraform
        run: terraform apply -auto-approve -var="create_service=true" -var="application_base_url="
      - name: Read application URL
        id: app
        working-directory: infra/terraform
        run: echo "url=$(terraform output -raw application_url)" >> "$GITHUB_OUTPUT"
      - name: Deploy authenticated application
        working-directory: infra/terraform
        run: >-
          terraform apply -auto-approve
          -var="create_service=true"
          -var="application_base_url=${{ steps.app.outputs.url }}"
      - name: Show deployment URL
        run: echo "TSUNAGU ${{ steps.app.outputs.url }}"
