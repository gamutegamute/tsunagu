<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TSUNAGU 非常用報告</title>
<style>
  /* 軽量化のため外部フォント・アイコンは使用しない */
  :root {
    --green: #1a5c4a;
    --green-dark: #13201e;
    --bg: #f5f5f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: #1a1a1a;
  }
  header {
    background: var(--green-dark);
    color: #fff;
    padding: 16px 20px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }
  main {
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    font-size: 16px; /* iOSでズームされないよう16px以上 */
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
  }
  .shelter-code {
    background: #eee;
    padding: 10px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 16px;
  }
  .packet-preview {
    font-family: monospace;
    font-size: 12px;
    background: #fff;
    border: 1px dashed #999;
    border-radius: 6px;
    padding: 8px 10px;
    word-break: break-all;
    color: #555;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 8px;
  }
  button:disabled {
    background: #999;
  }
  .result {
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .result.success {
    display: block;
    background: #e5f3ec;
    color: #1a5c4a;
  }
  .result.error {
    display: block;
    background: #fbe7e7;
    color: #a12a2a;
  }
  .device-info {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.8;
  }
  .note {
    font-size: 11px;
    color: #777;
    margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>TSUNAGU 非常用報告</h1>
  <p>LoRa経由で本部へ最低限の情報を送ります</p>
</header>

<main>
  <div class="field">
    <label>この端末</label>
    <div class="device-info">
      <div>避難所コード: <span class="shelter-code" id="shelterCode">-</span></div>
      <div>端末ID: <span id="deviceId">-</span></div>
    </div>
  </div>

  <div class="field">
    <label for="people">人数 <span aria-hidden="true">*</span></label>
    <input type="number" id="people" inputmode="numeric" min="0" max="1000000" step="1" placeholder="例: 170" required>
  </div>

  <div class="field">
    <label for="water">水在庫(L) <span aria-hidden="true">*</span></label>
    <input type="number" id="water" inputmode="numeric" min="0" max="1000000" step="1" placeholder="例: 18" required>
  </div>

  <div class="field">
    <label for="urgency">緊急度</label>
    <select id="urgency">
      <option value="NORMAL" selected>NORMAL(通常)</option>
      <option value="WARNING">WARNING(注意)</option>
      <option value="ALERT">ALERT(警戒)</option>
      <option value="CRITICAL">CRITICAL(重大)</option>
    </select>
  </div>

  <div class="field">
    <label for="requestCode">要請コード</label>
    <select id="requestCode">
      <option value="NONE">要請なし</option>
      <option value="REQ_WATER">REQ_WATER(水)</option>
      <option value="REQ_FOOD">REQ_FOOD(食料)</option>
      <option value="REQ_MEDICAL">REQ_MEDICAL(医療)</option>
      <option value="REQ_RESCUE">REQ_RESCUE(救助)</option>
      <option value="REQ_CONFIRM">REQ_CONFIRM(安否確認)</option>
    </select>
  </div>

  <div class="field">
    <label>送信内容プレビュー(入力した部分)</label>
    <div class="packet-preview" id="packetPreview">-</div>
    <p class="note">通し番号と署名はT-Beamが付けます。報告時刻には、このスマートフォンの時計(<span id="deviceTime">-</span>)を使います。</p>
  </div>

  <button id="submitBtn" onclick="submitReport()">LoRaで送信する</button>

  <div class="result" id="result"></div>

  <p class="note">
    ※ この画面はT-Beamが配信する非常用ページです。本部が受信したことを保証するものではありません。<br>
    ※ 報告者名・メモなどの詳細は、通信復旧後にTSUNAGUアプリからご報告ください。
  </p>
</main>

<script>
  // T-Beam側の契約(hardware/TBeamEmergencySender)
  //   GET  /info : {"device_id": "...", "shelter_code": "..."}(読み取り専用の表示用)
  //   POST /send : reported_at / people_count / water_stock / status / request_code
  // 避難所コード・通し番号・署名はT-Beamが付ける。ブラウザは鍵や署名を扱わない。
  const INFO_ENDPOINT = "/info";
  const SUBMIT_ENDPOINT = "/send";
  const MAX_REPORT_VALUE = 1000000;
  let sending = false;

  // 決定事項31(改訂版): クラウド版アプリから遷移してきた場合、
  // 個人情報を含まない最低限の値だけをURLパラメータで事前入力する
  // 例: http://192.168.4.1/?people=170&water=18&status=WARNING&request=REQ_WATER
  // 避難所コードはT-Beamの設定値を使うので、URLパラメータでは変えられない。
  function applyPrefill() {
    const params = new URLSearchParams(window.location.search);
    const people = params.get("people");
    const water = params.get("water");
    const status = params.get("status");
    const request = params.get("request");

    if (people !== null) document.getElementById("people").value = people;
    if (water !== null) document.getElementById("water").value = water;
    if (status !== null && ["NORMAL", "WARNING", "ALERT", "CRITICAL"].includes(status)) {
      document.getElementById("urgency").value = status;
    }
    if (request !== null) {
      const select = document.getElementById("requestCode");
      const hasOption = Array.from(select.options).some(function (opt) { return opt.value === request; });
      if (hasOption) select.value = request;
    }
  }

  async function loadDeviceInfo() {
    try {
      const res = await fetch(INFO_ENDPOINT, { cache: "no-store" });
      if (!res.ok) return;
      const info = await res.json();
      // textContentで表示する(HTMLとして解釈しない)
      document.getElementById("shelterCode").textContent = info.shelter_code || "未設定";
      document.getElementById("deviceId").textContent = info.device_id || "未設定";
    } catch (e) {
      // 表示できなくても送信はT-Beam側の設定値で行われる
    }
  }

  // 人数・水在庫は必須項目とする。空欄のまま「0」として送ってしまうと
  // 実際には無回答なのに「0人・水0L」という誤報になるため、未入力・不正な
  // 値(負の数・小数・上限超過)の場合は送信をブロックし、その理由を返す。
  function validateCountField(rawValue, label) {
    const trimmed = (rawValue || "").trim();
    if (trimmed === "") {
      return { valid: false, message: label + "を入力してください" };
    }
    if (!/^\d+$/.test(trimmed)) {
      return { valid: false, message: label + "は0以上の整数で入力してください" };
    }
    const value = Number(trimmed);
    if (value > MAX_REPORT_VALUE) {
      return { valid: false, message: label + "は" + MAX_REPORT_VALUE + "以下で入力してください" };
    }
    return { valid: true, value: value };
  }

  function validateForm() {
    const peopleResult = validateCountField(document.getElementById("people").value, "人数");
    if (!peopleResult.valid) return peopleResult;

    const waterResult = validateCountField(document.getElementById("water").value, "水在庫");
    if (!waterResult.valid) return waterResult;

    return { valid: true, people: peopleResult.value, water: waterResult.value };
  }

  function nowUnixSeconds() {
    return Math.floor(Date.now() / 1000);
  }

  // プレビューは利用者が入力した部分だけ(人数|水在庫|緊急度|要請コード)。
  // 端末ID・通し番号・署名はT-Beamが付けるので表示しない。
  function updatePreview() {
    const people = document.getElementById("people").value || "-";
    const water = document.getElementById("water").value || "-";
    const urgency = document.getElementById("urgency").value;
    const requestCode = document.getElementById("requestCode").value;
    document.getElementById("packetPreview").textContent = [people, water, urgency, requestCode].join("|");
    document.getElementById("deviceTime").textContent = new Date().toLocaleString("ja-JP");
  }

  ["people", "water", "urgency", "requestCode"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", updatePreview);
    document.getElementById(id).addEventListener("change", updatePreview);
  });
  applyPrefill();
  updatePreview();
  loadDeviceInfo();

  function showResult(success, message) {
    const el = document.getElementById("result");
    el.className = "result " + (success ? "success" : "error");
    el.textContent = message;
  }

  async function submitReport() {
    // 送信中の二重要求は受け付けない(T-Beam側でも409で断る)
    if (sending) return;
    const validation = validateForm();
    if (!validation.valid) {
      showResult(false, validation.message);
      return;
    }

    sending = true;
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "送信中...";
    updatePreview();

    const formData = new URLSearchParams();
    formData.set("reported_at", String(nowUnixSeconds()));
    formData.set("people_count", String(validation.people));
    formData.set("water_stock", String(validation.water));
    formData.set("status", document.getElementById("urgency").value);
    formData.set("request_code", document.getElementById("requestCode").value);

    try {
      const res = await fetch(SUBMIT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });
      let message = "";
      try {
        const body = await res.json();
        message = body && typeof body.message === "string" ? body.message : "";
      } catch (e) {
        message = "";
      }

      if (res.ok) {
        // 本部が受信したかどうかはこの時点ではわからないため、
        // 「送出完了」に留める(「本部受信済み」とは表示しない)
        showResult(true, message || "LoRa送出完了");
      } else {
        // 入力内容は消さずに残す
        showResult(false, message || "LoRa送信に失敗しました。入力内容を確認してください");
      }
    } catch (e) {
      showResult(false, "LoRa送信に失敗しました。入力内容はそのままです");
    } finally {
      sending = false;
      btn.disabled = false;
      btn.textContent = "LoRaで送信する";
    }
  }
</script>

</body>
</html>
